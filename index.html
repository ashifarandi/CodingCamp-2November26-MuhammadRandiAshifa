<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="dashboard-header">
        <div class="header-content">
            <div class="date-display" id="dateDisplay">MM/DD/YYYY</div>
            <div class="time-display" id="timeDisplay">HH:MM AM/PM</div>
            <div class="greeting" id="greeting">Good Morning</div>
        </div>
    </header>

    <main class="dashboard-main">
        <!-- Focus Timer Section -->
        <section class="timer-section" aria-labelledby="timer-heading">
            <h2 id="timer-heading" class="section-title">Focus Timer</h2>
            <div class="timer-display" id="timerDisplay">25:00</div>
            <div class="timer-controls">
                <button type="button" id="startTimerBtn" class="btn btn-primary">Start</button>
                <button type="button" id="stopTimerBtn" class="btn btn-secondary">Stop</button>
                <button type="button" id="resetTimerBtn" class="btn btn-secondary">Reset</button>
            </div>
        </section>

        <!-- Task Management Section -->
        <section class="task-section" aria-labelledby="tasks-heading">
            <h2 id="tasks-heading" class="section-title">My Tasks</h2>
            <div class="task-input-container">
                <input type="text" id="taskInput" placeholder="Add a new task..." maxlength="255">
                <button type="button" id="addTaskBtn" class="btn btn-primary">Add Task</button>
            </div>
            <ul class="task-list" id="taskList" aria-label="Task list">
                <!-- Tasks will be rendered here -->
            </ul>
            <div class="task-count" id="taskCount">0 tasks</div>
        </section>

        <!-- Quick Links Section -->
        <section class="quick-links-section" aria-labelledby="links-heading">
            <h2 id="links-heading" class="section-title">Quick Links</h2>
            <div class="link-input-container">
                <input type="text" id="linkLabelInput" placeholder="Link label (e.g., Google)" maxlength="100">
                <input type="text" id="linkUrlInput" placeholder="https://example.com" maxlength="255">
                <button type="button" id="addLinkBtn" class="btn btn-primary">Add Link</button>
            </div>
            <ul class="link-list" id="linkList" aria-label="Quick links list">
                <!-- Links will be rendered here -->
            </ul>
            <div class="link-count" id="linkCount">0 links</div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
